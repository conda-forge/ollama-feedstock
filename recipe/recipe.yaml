context:
  version: "0.40.18"
  cuda: ${{ "true" if cuda_compiler_version != "None" else "" }}
  cuda_build_string: cuda_${{ cuda_compiler_version | version_to_buildstring }}
  string_prefix: ${{ cuda_build_string if cuda else "cpu_" }}
  build_number: 0

package:
  name: ollama
  version: ${{ version }}

source:
  url: https://github.com/ollama/ollama/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 205298799e63978c78b18d9bef2f3e0625e02972364956ce5aefc3c95b36bf29
  patches:
    - 0001-cmake-forward-cross-compilation-vars.patch

build:
  number: ${{ build_number }}
  string: ${{ string_prefix }}h${{ hash }}_${{ build_number }}
  variant:
    use_keys:
      # use cuda from the variant config, e.g. to build multiple CUDA variants
      - ${{ "cuda" if cuda }}
    # this will down-prioritize the cuda variant versus other variants of the package
    down_prioritize_variant: ${{ 1 if cuda == "true" else 0 }}
  script:
    - if: win
      then: [build.bat]
      else: [build.sh]
  skip:
    - cuda and match(cuda_compiler_version, "<12")

requirements:
  build:
    # go's cgo builds carry a run_constraint on the pinning's C compiler
    # (gcc 15 for go >=1.27), but nvcc 12.x only supports gcc <=14. Use the
    # nocgo toolchain there; ollama's cmake forces CGO_ENABLED=1 and cgo
    # picks up $CC/$CXX from the conda gcc 14 activation.
    - if: cuda and match(cuda_compiler_version, "<13")
      then: ${{ compiler('go-nocgo') }}
      else: ${{ compiler('go-cgo') }}
    - cmake
    - make
    - go-licenses ~= 1.6
    - if: win
      then:
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - ninja
      else:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
    - if: cuda
      then:
        - ${{ compiler('cuda') }}
        - cuda-version ==${{ cuda_compiler_version }}
  host:
    - if: cuda
      then:
        - cuda-version ==${{ cuda_compiler_version }}
        - libcublas-dev
        # ggml-cuda includes nvml.h (NVML itself is dlopen'ed at runtime)
        - cuda-nvml-dev
  ignore_run_exports:
    from_package:
      - if: cuda
        then: libcublas-dev
tests:
  - script:
      - if: unix
        then: HOME=/tmp ollama --version  # ollama panics if $HOME is unset (upstream regression in v0.20.7)
      - if: win
        then: ollama --version

about:
  homepage: https://ollama.com/
  repository: https://github.com/ollama/ollama
  documentation: https://github.com/ollama/ollama
  summary: Ollama CLI
  description: |
    Ollama is an easy way to get local language models running on your computer through a command-line interface.
  license: MIT
  license_file:
    - LICENSE
    - license-files/

extra:
  recipe-maintainers:
    - jmakovicka
    - sodre
    - benmoss
    - JakeLehle
